<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="BlackHole setup: a Multi-Output Device plays to your speakers and into the BlackHole virtual input, which QuickTime records; the microphone joins only through an extra Aggregate Device">
  <title>The BlackHole + QuickTime signal path</title>
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
    <marker id="m9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c757d"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .box { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .accent { stroke: #0d6efd; stroke-width: 2; fill: none; }
    .dash { stroke: #6c757d; stroke-width: 1.75; stroke-dasharray: 6 5; fill: none; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #6c757d; }
    .step { font-size: 12px; font-weight: 700; fill: #0d6efd; }
  </style>

  <rect class="box" x="20" y="40" width="200" height="70" rx="8"/>
  <text class="t" x="120" y="70" text-anchor="middle">Everything</text>
  <text class="t" x="120" y="90" text-anchor="middle">the Mac plays</text>

  <rect class="box" x="270" y="40" width="220" height="70" rx="8" stroke="#0d6efd"/>
  <text class="t" x="380" y="70" text-anchor="middle">Multi-Output Device</text>
  <text class="s" x="380" y="90" text-anchor="middle">the step tutorials skip</text>

  <rect class="box" x="540" y="20" width="200" height="60" rx="8"/>
  <text class="t" x="640" y="46" text-anchor="middle">Your speakers</text>
  <text class="s" x="640" y="66" text-anchor="middle">you hear what you record</text>

  <rect class="box" x="540" y="115" width="200" height="60" rx="8"/>
  <text class="t" x="640" y="141" text-anchor="middle">BlackHole 2ch</text>
  <text class="s" x="640" y="161" text-anchor="middle">virtual input (loopback)</text>

  <rect class="box" x="270" y="230" width="220" height="60" rx="8"/>
  <text class="t" x="380" y="256" text-anchor="middle">QuickTime / ffmpeg</text>
  <text class="s" x="380" y="276" text-anchor="middle">records the BlackHole input</text>

  <rect class="box" x="20" y="230" width="200" height="60" rx="8"/>
  <text class="t" x="120" y="256" text-anchor="middle">Your microphone</text>
  <text class="s" x="120" y="276" text-anchor="middle">only via Aggregate Device</text>

  <line class="accent" x1="220" y1="75" x2="265" y2="75" marker-end="url(#a9)"/>
  <path class="accent" d="M490,60 C515,55 520,50 535,48" marker-end="url(#a9)"/>
  <path class="accent" d="M490,95 C515,100 520,135 535,142" marker-end="url(#a9)"/>
  <path class="accent" d="M640,175 C640,205 560,215 495,225" marker-end="url(#a9)"/>
  <path class="dash" d="M220,260 C240,260 245,262 265,262" marker-end="url(#m9)"/>

  <text class="step" x="30" y="330">solid = the free recipe (5 steps)</text>
  <text class="step" x="30" y="348" fill="#6c757d">dashed = adding your mic (fiddly: build an Aggregate Device, balance levels by hand)</text>
</svg>
