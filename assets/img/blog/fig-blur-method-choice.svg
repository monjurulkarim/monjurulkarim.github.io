<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Decision flow for blurring a face in a video: if the face never moves, an ffmpeg fixed box works; if it moves, sensitive or repeated work calls for on-device redaction software with detection and a review queue, while a one-off clip can use manual editor tracking or a mobile app">
  <title>Which blur method fits which shot</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 13px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .lab { font-size: 11px; font-weight: 700; fill: #0d6efd; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="285" y="18" width="190" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">Is the face moving?</text>

  <rect class="branch" x="60" y="102" width="250" height="48" rx="8"/>
  <text class="bt" x="185" y="122" text-anchor="middle">No — locked-off camera</text>
  <text class="s" x="185" y="140" text-anchor="middle">tripod, doorbell, fixed dashcam</text>

  <rect class="branch" x="450" y="102" width="250" height="48" rx="8"/>
  <text class="bt" x="575" y="122" text-anchor="middle">Yes — it moves</text>
  <text class="s" x="575" y="140" text-anchor="middle">handheld, panning, people walking</text>

  <path class="link" d="M330,62 C290,74 230,84 195,97" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C470,74 530,84 565,97" marker-end="url(#bm)"/>

  <rect class="pick" x="30" y="205" width="220" height="64" rx="8"/>
  <text class="bt" x="140" y="228" text-anchor="middle" fill="#0d6efd">ffmpeg fixed box</text>
  <text class="s" x="140" y="247" text-anchor="middle">free one-liner; fails silently</text>
  <text class="s" x="140" y="262" text-anchor="middle">the moment the face moves</text>

  <rect class="pick" x="270" y="205" width="230" height="64" rx="8"/>
  <text class="bt" x="385" y="228" text-anchor="middle" fill="#0d6efd">On-device redaction software</text>
  <text class="s" x="385" y="247" text-anchor="middle">auto detection + review queue</text>
  <text class="s" x="385" y="262" text-anchor="middle">sensitive or repeated work</text>

  <rect class="pick" x="520" y="205" width="210" height="64" rx="8"/>
  <text class="bt" x="625" y="228" text-anchor="middle" fill="#0d6efd">Editor tracking or mobile app</text>
  <text class="s" x="625" y="247" text-anchor="middle">one-off clips; watch for</text>
  <text class="s" x="625" y="262" text-anchor="middle">cloud uploads and watermarks</text>

  <path class="link" d="M130,150 C110,168 95,180 92,198" marker-end="url(#bm)"/>
  <path class="link" d="M520,150 C470,170 430,182 402,198" marker-end="url(#bm)"/>
  <text class="lab" x="470" y="180">sensitive / regular</text>
  <path class="link" d="M620,150 C640,168 650,180 653,198" marker-end="url(#bm)"/>
  <text class="lab" x="652" y="180">one-off clip</text>
</svg>
