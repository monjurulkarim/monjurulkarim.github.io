<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="A drawn black rectangle leaves the text selectable underneath; true redaction deletes the content and rebuilds the page so nothing remains to select">
  <title>Covering is not redacting</title>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .page { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .line { fill: #adb5bd; }
    .t { font-size: 14px; font-weight: 700; }
    .s { font-size: 12px; fill: #6c757d; }
  </style>

  <!-- LEFT: drawn box -->
  <text class="t" x="180" y="30" text-anchor="middle">Drawn box — ✗</text>
  <rect class="page" x="60" y="50" width="240" height="200" rx="6"/>
  <rect class="line" x="85" y="80" width="190" height="7" rx="3.5"/>
  <rect class="line" x="85" y="102" width="160" height="7" rx="3.5"/>
  <!-- secret line under the box, peeking out -->
  <rect class="line" x="85" y="124" width="190" height="7" rx="3.5"/>
  <rect x="90" y="117" width="150" height="21" fill="#212529" fill-opacity="0.82"/>
  <rect class="line" x="85" y="152" width="175" height="7" rx="3.5"/>
  <rect class="line" x="85" y="174" width="120" height="7" rx="3.5"/>
  <!-- selection highlight sneaking past the box -->
  <rect x="240" y="118" width="35" height="19" fill="#0d6efd" fill-opacity="0.25"/>
  <path d="M276,118 l4,0 0,19 -4,0 z" fill="#0d6efd"/>
  <text class="s" x="180" y="285" text-anchor="middle">text still exists under the rectangle —</text>
  <text class="s" x="180" y="303" text-anchor="middle">select, copy, delete-the-box: all work</text>

  <!-- RIGHT: true redaction -->
  <text class="t" x="570" y="30" text-anchor="middle">True redaction — ✓</text>
  <rect class="page" x="460" y="50" width="240" height="200" rx="6"/>
  <rect class="line" x="485" y="80" width="190" height="7" rx="3.5"/>
  <rect class="line" x="485" y="102" width="160" height="7" rx="3.5"/>
  <!-- fully removed: solid bar, nothing under it -->
  <rect x="485" y="117" width="190" height="21" fill="#212529"/>
  <rect class="line" x="485" y="152" width="175" height="7" rx="3.5"/>
  <rect class="line" x="485" y="174" width="120" height="7" rx="3.5"/>
  <text class="s" x="570" y="285" text-anchor="middle">content deleted and the page rebuilt —</text>
  <text class="s" x="570" y="303" text-anchor="middle">nothing left to select or extract</text>
</svg>
