<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Decision flow for cleaning up a Mac desktop: a desktop that is only visually messy and still in use suits built-in Stacks; a dumping ground you will sort by hand suits folder triage; hundreds of same-type files suit a Terminal sweep script; mystery files that need reading, renaming, or deduplication suit an on-device AI organizer such as TidyMind">
  <title>Which desktop-cleanup method fits which desktop</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="280" y="18" width="200" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">What's your desktop like?</text>

  <rect class="branch" x="22" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="107" y="116" text-anchor="middle">Only visually messy</text>
  <text class="s" x="107" y="133" text-anchor="middle">you use everything on it</text>

  <rect class="branch" x="204" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="289" y="116" text-anchor="middle">Dumping ground</text>
  <text class="s" x="289" y="133" text-anchor="middle">willing to sort by hand</text>

  <rect class="branch" x="386" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="471" y="116" text-anchor="middle">Hundreds of files</text>
  <text class="s" x="471" y="133" text-anchor="middle">same-type bulge</text>

  <rect class="branch" x="568" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="653" y="116" text-anchor="middle">Mystery files + dupes</text>
  <text class="s" x="653" y="133" text-anchor="middle">hard to name or compare</text>

  <path class="link" d="M330,62 C280,72 190,80 115,90" marker-end="url(#bm)"/>
  <path class="link" d="M360,62 C340,72 310,80 292,90" marker-end="url(#bm)"/>
  <path class="link" d="M400,62 C420,72 450,80 468,90" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C480,72 570,80 645,90" marker-end="url(#bm)"/>

  <rect class="pick" x="22" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="107" y="218" text-anchor="middle" fill="#0d6efd">Stacks</text>
  <text class="s" x="107" y="238" text-anchor="middle">built into macOS; instant,</text>
  <text class="s" x="107" y="253" text-anchor="middle">reversible — the view is</text>
  <text class="s" x="107" y="268" text-anchor="middle">tidied, nothing moves</text>

  <rect class="pick" x="204" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="289" y="218" text-anchor="middle" fill="#0d6efd">Folder triage</text>
  <text class="s" x="289" y="238" text-anchor="middle">3–5 real folders, drag,</text>
  <text class="s" x="289" y="253" text-anchor="middle">done — about 20 minutes</text>
  <text class="s" x="289" y="268" text-anchor="middle">and lasts for months</text>

  <rect class="pick" x="386" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="471" y="218" text-anchor="middle" fill="#0d6efd">Terminal sweep</text>
  <text class="s" x="471" y="238" text-anchor="middle">one command sorts files</text>
  <text class="s" x="471" y="253" text-anchor="middle">into folders by extension</text>
  <text class="s" x="471" y="268" text-anchor="middle">— undoable by hand</text>

  <rect class="pick" x="568" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="653" y="218" text-anchor="middle" fill="#0d6efd">On-device AI organizer</text>
  <text class="s" x="653" y="238" text-anchor="middle">reads what files are, files</text>
  <text class="s" x="653" y="253" text-anchor="middle">by content, dedupes —</text>
  <text class="s" x="653" y="268" text-anchor="middle">TidyMind, mine</text>

  <path class="link" d="M107,148 L107,190" marker-end="url(#bm)"/>
  <path class="link" d="M289,148 L289,190" marker-end="url(#bm)"/>
  <path class="link" d="M471,148 L471,190" marker-end="url(#bm)"/>
  <path class="link" d="M653,148 L653,190" marker-end="url(#bm)"/>
</svg>
