<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Decision flow for extracting audio from a video on Mac: a file in an MP4 or MOV with no installs allowed suits the built-in afconvert one-liner; any file including MKV where quality must not change suits ffmpeg stream copy; preferring clicking to typing suits VLC's Convert/Save dialog; audio that only exists as live playback suits recording system audio with AudioRecord">
  <title>Which extraction method fits which situation</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="272" y="18" width="216" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">Where is the sound?</text>

  <rect class="branch" x="22" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="107" y="116" text-anchor="middle">In an .mp4/.mov,</text>
  <text class="s" x="107" y="133" text-anchor="middle">no installs allowed</text>

  <rect class="branch" x="204" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="289" y="116" text-anchor="middle">Any file, MKV too;</text>
  <text class="s" x="289" y="133" text-anchor="middle">quality must not change</text>

  <rect class="branch" x="386" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="471" y="116" text-anchor="middle">In a file — you just</text>
  <text class="s" x="471" y="133" text-anchor="middle">prefer clicking to typing</text>

  <rect class="branch" x="568" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="653" y="116" text-anchor="middle">Only exists as</text>
  <text class="s" x="653" y="133" text-anchor="middle">playback: stream, live call</text>

  <path class="link" d="M330,62 C280,72 190,80 115,90" marker-end="url(#bm)"/>
  <path class="link" d="M360,62 C340,72 310,80 292,90" marker-end="url(#bm)"/>
  <path class="link" d="M400,62 C420,72 450,80 468,90" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C480,72 570,80 645,90" marker-end="url(#bm)"/>

  <rect class="pick" x="22" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="107" y="218" text-anchor="middle" fill="#0d6efd">afconvert</text>
  <text class="s" x="107" y="238" text-anchor="middle">built into macOS,</text>
  <text class="s" x="107" y="253" text-anchor="middle">one line; rejects .mkv</text>
  <text class="s" x="107" y="268" text-anchor="middle">re-encodes to AAC</text>

  <rect class="pick" x="204" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="289" y="218" text-anchor="middle" fill="#0d6efd">ffmpeg stream copy</text>
  <text class="s" x="289" y="238" text-anchor="middle">-vn -c:a copy —</text>
  <text class="s" x="289" y="253" text-anchor="middle">bit-identical audio,</text>
  <text class="s" x="289" y="268" text-anchor="middle">seconds for long files</text>

  <rect class="pick" x="386" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="471" y="218" text-anchor="middle" fill="#0d6efd">VLC Convert/Save</text>
  <text class="s" x="471" y="238" text-anchor="middle">free GUI; profiles</text>
  <text class="s" x="471" y="253" text-anchor="middle">re-encode, so slower</text>
  <text class="s" x="471" y="268" text-anchor="middle">and not lossless</text>

  <rect class="pick" x="568" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="653" y="218" text-anchor="middle" fill="#0d6efd">AudioRecord</text>
  <text class="s" x="653" y="238" text-anchor="middle">records system audio</text>
  <text class="s" x="653" y="253" text-anchor="middle">while it plays,</text>
  <text class="s" x="653" y="268" text-anchor="middle">to WAV or M4A</text>

  <path class="link" d="M107,148 L107,190" marker-end="url(#bm)"/>
  <path class="link" d="M289,148 L289,190" marker-end="url(#bm)"/>
  <path class="link" d="M471,148 L471,190" marker-end="url(#bm)"/>
  <path class="link" d="M653,148 L653,190" marker-end="url(#bm)"/>
</svg>
