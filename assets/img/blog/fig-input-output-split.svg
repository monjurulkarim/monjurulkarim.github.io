<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="macOS exposes only microphones as recording inputs; the Mac's own sound is an output and needs a workaround">
  <title>Why recording system audio needs a workaround</title>
  <defs>
    <marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c757d"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .box { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; rx: 8; }
    .panel { fill: #fbfcfd; stroke: #dee2e6; stroke-width: 1.5; }
    .muted { fill: #6c757d; }
    .h { font-size: 13px; font-weight: 700; fill: #6c757d; letter-spacing: .08em; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
  </style>

  <rect class="panel" x="20" y="20" width="340" height="290" rx="10"/>
  <text class="h" x="40" y="50">WHAT macOS EXPOSES AS INPUTS</text>
  <rect class="box" x="50" y="75" width="280" height="52"/>
  <text class="t" x="190" y="106" text-anchor="middle">Microphone</text>
  <text class="s muted" x="190" y="180" text-anchor="middle">Voice Memos, QuickTime, and every</text>
  <text class="s muted" x="190" y="198" text-anchor="middle">recorder see microphones — and</text>
  <text class="s muted" x="190" y="216" text-anchor="middle">nothing else. Speakers are outputs;</text>
  <text class="s muted" x="190" y="234" text-anchor="middle">nothing bridges the two worlds.</text>
  <text class="s" x="190" y="285" text-anchor="middle" fill="#198754" font-weight="700">✓ built in</text>

  <rect class="panel" x="400" y="20" width="340" height="290" rx="10"/>
  <text class="h" x="420" y="50">WHAT YOU WANT TO RECORD</text>
  <rect class="box" x="420" y="68" width="300" height="44"/>
  <text class="t" x="440" y="95">Your voice</text>
  <text class="s" x="692" y="95" text-anchor="end" fill="#198754" font-weight="700">mic ✓</text>
  <rect class="box" x="420" y="122" width="300" height="44"/>
  <text class="t" x="440" y="149">People in the room</text>
  <text class="s" x="692" y="149" text-anchor="end" fill="#198754" font-weight="700">mic ✓</text>
  <rect class="box" x="420" y="176" width="300" height="44" stroke="#dc3545"/>
  <text class="t" x="440" y="203">Sound the Mac is playing</text>
  <text class="s" x="692" y="203" text-anchor="end" fill="#dc3545" font-weight="700">output ✗</text>
  <text class="s muted" x="420" y="248">Not an input. Two workarounds:</text>
  <rect x="420" y="260" width="145" height="32" rx="16" fill="#eef4ff"/>
  <text class="s" x="492" y="281" text-anchor="middle" fill="#0d6efd" font-weight="600">BlackHole loopback</text>
  <rect x="575" y="260" width="145" height="32" rx="16" fill="#eef4ff"/>
  <text class="s" x="647" y="281" text-anchor="middle" fill="#0d6efd" font-weight="600">ScreenCaptureKit app</text>
</svg>
