<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Pasting a document creates a second copy of its PII on a server you do not control; redacting locally first means no PII ever leaves your machine">
  <title>The paste path, with and without redaction</title>
  <defs>
    <marker id="r8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc3545"/>
    </marker>
    <marker id="g8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#198754"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .box { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .lane { font-size: 13px; font-weight: 700; }
    .red { stroke: #dc3545; stroke-width: 2; fill: none; }
    .green { stroke: #198754; stroke-width: 2; fill: none; }
  </style>

  <text class="lane" x="20" y="35" fill="#dc3545">Paste now</text>
  <rect class="box" x="20" y="55" width="190" height="62" rx="8"/>
  <text class="t" x="115" y="80" text-anchor="middle">Document</text>
  <text class="s" x="115" y="99" text-anchor="middle">names · diagnoses · codenames</text>
  <rect class="box" x="290" y="55" width="220" height="62" rx="8" stroke="#dc3545"/>
  <text class="t" x="400" y="80" text-anchor="middle" fill="#dc3545">Cloud LLM server</text>
  <text class="s" x="400" y="99" text-anchor="middle">second copy; retention not yours</text>
  <rect class="box" x="590" y="55" width="150" height="62" rx="8"/>
  <text class="t" x="665" y="80" text-anchor="middle">Answer</text>
  <text class="s" x="665" y="99" text-anchor="middle">useful — but late</text>
  <line class="red" x1="210" y1="86" x2="285" y2="86" marker-end="url(#r8)"/>
  <line class="red" x1="510" y1="86" x2="585" y2="86" marker-end="url(#r8)"/>

  <text class="lane" x="20" y="195" fill="#198754">Redact first, locally</text>
  <rect class="box" x="20" y="215" width="190" height="62" rx="8"/>
  <text class="t" x="115" y="240" text-anchor="middle">Document</text>
  <text class="s" x="115" y="259" text-anchor="middle">same file, same sensitivity</text>
  <rect class="box" x="290" y="215" width="220" height="62" rx="8" stroke="#198754"/>
  <text class="t" x="400" y="240" text-anchor="middle" fill="#198754">Local redaction</text>
  <text class="s" x="400" y="259" text-anchor="middle">regex + local LLM, offline</text>
  <rect class="box" x="590" y="215" width="150" height="62" rx="8"/>
  <text class="t" x="665" y="240" text-anchor="middle">Paste →</text>
  <text class="s" x="665" y="259" text-anchor="middle">answer; no PII left it</text>
  <line class="green" x1="210" y1="246" x2="285" y2="246" marker-end="url(#g8)"/>
  <line class="green" x1="510" y1="246" x2="585" y2="246" marker-end="url(#g8)"/>

  <text class="s" x="20" y="315">The leak happens on the way in — before you read the first word of the answer.</text>
</svg>
