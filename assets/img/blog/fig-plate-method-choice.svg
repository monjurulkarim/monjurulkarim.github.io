<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Decision flow for blurring license plates in a video: moving traffic with many plates or sensitive footage calls for on-device redaction software with auto detection and a review queue; a one-off with few plates suits editor mask tracking; a locked-off camera with a stationary plate suits an ffmpeg fixed box; a quick social clip can use an online tool or app">
  <title>Which plate-blur method fits which footage</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="285" y="18" width="190" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">What's the footage?</text>

  <rect class="branch" x="22" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="107" y="116" text-anchor="middle">Many plates, sensitive</text>
  <text class="s" x="107" y="133" text-anchor="middle">traffic, fleets, CCTV</text>

  <rect class="branch" x="204" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="289" y="116" text-anchor="middle">One-off, few plates</text>
  <text class="s" x="289" y="133" text-anchor="middle">you already edit video</text>

  <rect class="branch" x="386" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="471" y="116" text-anchor="middle">Locked-off camera</text>
  <text class="s" x="471" y="133" text-anchor="middle">plate never moves</text>

  <rect class="branch" x="568" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="653" y="116" text-anchor="middle">Quick social clip</text>
  <text class="s" x="653" y="133" text-anchor="middle">nothing sensitive</text>

  <path class="link" d="M330,62 C280,72 190,80 115,90" marker-end="url(#bm)"/>
  <path class="link" d="M360,62 C340,72 310,80 292,90" marker-end="url(#bm)"/>
  <path class="link" d="M400,62 C420,72 450,80 468,90" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C480,72 570,80 645,90" marker-end="url(#bm)"/>

  <rect class="pick" x="22" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="107" y="218" text-anchor="middle" fill="#0d6efd">On-device redaction</text>
  <text class="bt" x="107" y="234" text-anchor="middle" fill="#0d6efd">software</text>
  <text class="s" x="107" y="252" text-anchor="middle">auto detection + review</text>
  <text class="s" x="107" y="267" text-anchor="middle">queue; works offline</text>

  <rect class="pick" x="204" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="289" y="218" text-anchor="middle" fill="#0d6efd">Editor mask tracking</text>
  <text class="s" x="289" y="238" text-anchor="middle">draw, track, inspect,</text>
  <text class="s" x="289" y="253" text-anchor="middle">fix — manual per plate</text>

  <rect class="pick" x="386" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="471" y="218" text-anchor="middle" fill="#0d6efd">ffmpeg fixed box</text>
  <text class="s" x="471" y="238" text-anchor="middle">free one-liner for a</text>
  <text class="s" x="471" y="253" text-anchor="middle">region that never moves</text>

  <rect class="pick" x="568" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="653" y="218" text-anchor="middle" fill="#0d6efd">Online tool or app</text>
  <text class="s" x="653" y="238" text-anchor="middle">fastest path; watch for</text>
  <text class="s" x="653" y="253" text-anchor="middle">uploads and watermarks</text>

  <path class="link" d="M107,148 L107,190" marker-end="url(#bm)"/>
  <path class="link" d="M289,148 L289,190" marker-end="url(#bm)"/>
  <path class="link" d="M471,148 L471,190" marker-end="url(#bm)"/>
  <path class="link" d="M653,148 L653,190" marker-end="url(#bm)"/>
</svg>
