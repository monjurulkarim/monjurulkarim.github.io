<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="On-device plate redaction pipeline in three steps: bundled AI models detect faces and plates frame by frame on your machine, every proposed redaction is approved, exempted, or adjusted by a human in a review queue, then the video renders with blur, pixelation, or a black box while the audio is kept — raw footage never leaves your machine">
  <title>How on-device plate redaction works, step by step</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .stage { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="215" y="18" width="330" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">From raw footage to redacted video</text>

  <rect class="stage" x="40" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="140" y="120" text-anchor="middle" fill="#0d6efd">1 · Detect</text>
  <text class="s" x="140" y="143" text-anchor="middle">bundled AI models find</text>
  <text class="s" x="140" y="159" text-anchor="middle">faces and plates frame</text>
  <text class="s" x="140" y="175" text-anchor="middle">by frame — on your</text>
  <text class="s" x="140" y="191" text-anchor="middle">machine, offline</text>

  <rect class="stage" x="280" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="380" y="120" text-anchor="middle" fill="#0d6efd">2 · Review queue</text>
  <text class="s" x="380" y="143" text-anchor="middle">every proposal lands as</text>
  <text class="s" x="380" y="159" text-anchor="middle">a line item you approve,</text>
  <text class="s" x="380" y="175" text-anchor="middle">exempt, or adjust — a</text>
  <text class="s" x="380" y="191" text-anchor="middle">human signs off</text>

  <rect class="stage" x="520" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="620" y="120" text-anchor="middle" fill="#0d6efd">3 · Render</text>
  <text class="s" x="620" y="143" text-anchor="middle">blur, pixelation, or a</text>
  <text class="s" x="620" y="159" text-anchor="middle">solid black box; whole</text>
  <text class="s" x="620" y="175" text-anchor="middle">video or segments;</text>
  <text class="s" x="620" y="191" text-anchor="middle">audio track kept</text>

  <path class="link" d="M240,155 L272,155" marker-end="url(#bm)"/>
  <path class="link" d="M480,155 L512,155" marker-end="url(#bm)"/>

  <rect class="pick" x="40" y="248" width="680" height="46" rx="8"/>
  <text class="s" x="380" y="268" text-anchor="middle">On-device by design: the models ship inside the app, so raw footage never leaves your machine</text>
  <text class="s" x="380" y="284" text-anchor="middle">— nothing is uploaded to anyone's servers, and nothing to delete later.</text>
</svg>
