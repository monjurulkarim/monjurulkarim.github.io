<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Decision flow: if files must stay offline choose PrivateRedact for documents or CaseGuard for video too; if cloud is fine choose Redactable for teams or Acrobat Pro if already subscribed; on zero budget use the free route and verify">
  <title>Which redaction tool for which constraint</title>
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 13px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="250" y="20" width="260" height="48" rx="24"/>
  <text class="t" x="380" y="50" text-anchor="middle" fill="#ffffff">Where can the file go?</text>

  <rect class="branch" x="60" y="110" width="280" height="46" rx="8"/>
  <text class="bt" x="200" y="130" text-anchor="middle">Nowhere — it stays offline</text>
  <text class="s" x="200" y="147" text-anchor="middle">contracts, medical, legal, air-gapped</text>

  <rect class="branch" x="420" y="110" width="280" height="46" rx="8"/>
  <text class="bt" x="560" y="130" text-anchor="middle">Cloud is acceptable</text>
  <text class="s" x="560" y="147" text-anchor="middle">already running on Drive / SharePoint</text>

  <path class="link" d="M330,68 C300,80 240,90 205,105" marker-end="url(#a11)"/>
  <path class="link" d="M430,68 C460,80 520,90 555,105" marker-end="url(#a11)"/>

  <rect class="pick" x="40" y="205" width="150" height="58" rx="8"/>
  <text class="bt" x="115" y="228" text-anchor="middle" fill="#0d6efd">PrivateRedact</text>
  <text class="s" x="115" y="247" text-anchor="middle">documents, local LLM</text>

  <rect class="pick" x="210" y="205" width="150" height="58" rx="8"/>
  <text class="bt" x="285" y="228" text-anchor="middle" fill="#0d6efd">CaseGuard</text>
  <text class="s" x="285" y="247" text-anchor="middle">+ video &amp; audio, on-prem</text>

  <rect class="pick" x="400" y="205" width="150" height="58" rx="8"/>
  <text class="bt" x="475" y="228" text-anchor="middle" fill="#0d6efd">Redactable</text>
  <text class="s" x="475" y="247" text-anchor="middle">team workflows, audit trail</text>

  <rect class="pick" x="570" y="205" width="150" height="58" rx="8"/>
  <text class="bt" x="645" y="228" text-anchor="middle" fill="#0d6efd">Acrobat Pro</text>
  <text class="s" x="645" y="247" text-anchor="middle">if already subscribed</text>

  <path class="link" d="M155,156 C130,170 118,185 114,200" marker-end="url(#a11)"/>
  <path class="link" d="M245,156 C270,170 282,185 286,200" marker-end="url(#a11)"/>
  <path class="link" d="M515,156 C490,170 482,185 478,200" marker-end="url(#a11)"/>
  <path class="link" d="M605,156 C630,170 640,185 645,200" marker-end="url(#a11)"/>

  <rect x="210" y="295" width="340" height="32" rx="16" fill="#fbfcfd" stroke="#dee2e6" stroke-width="1.5"/>
  <text class="s" x="380" y="316" text-anchor="middle">$0 budget → free route + the verify step (guide)</text>
</svg>
