<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The three modes of Finder's Rename Finder Items pop-up: Replace text changes scan001.pdf into invoice-scan001.pdf; Add text puts text before or after the name, report.pdf becomes report-draft.pdf; Format combines a custom name with a counter, IMG_4021.jpg becomes trip-001.jpg">
  <title>The three modes of Finder's batch rename</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .m { font-size: 12px; fill: #0d6efd; font-weight: 700; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="230" y="18" width="300" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">Select files → Control-click → Rename</text>

  <rect class="branch" x="35" y="96" width="220" height="52" rx="8"/>
  <text class="bt" x="145" y="116" text-anchor="middle">Replace text</text>
  <text class="s" x="145" y="133" text-anchor="middle">find and replace in the name</text>

  <rect class="branch" x="270" y="96" width="220" height="52" rx="8"/>
  <text class="bt" x="380" y="116" text-anchor="middle">Add text</text>
  <text class="s" x="380" y="133" text-anchor="middle">before or after the name</text>

  <rect class="branch" x="505" y="96" width="220" height="52" rx="8"/>
  <text class="bt" x="615" y="116" text-anchor="middle">Format</text>
  <text class="s" x="615" y="133" text-anchor="middle">custom name + index/counter/date</text>

  <path class="link" d="M320,62 C270,72 190,80 150,90" marker-end="url(#bm)"/>
  <path class="link" d="M380,62 L380,90" marker-end="url(#bm)"/>
  <path class="link" d="M440,62 C490,72 570,80 610,90" marker-end="url(#bm)"/>

  <rect class="pick" x="35" y="196" width="220" height="84" rx="8"/>
  <text class="m" x="145" y="218" text-anchor="middle">Replace text</text>
  <text class="s" x="145" y="238" text-anchor="middle">find "scan" · replace with "invoice"</text>
  <text class="s" x="145" y="256" text-anchor="middle">scan001.pdf →</text>
  <text class="s" x="145" y="271" text-anchor="middle">invoice-scan001.pdf</text>

  <rect class="pick" x="270" y="196" width="220" height="84" rx="8"/>
  <text class="m" x="380" y="218" text-anchor="middle">Add text</text>
  <text class="s" x="380" y="238" text-anchor="middle">"-draft" after the existing name</text>
  <text class="s" x="380" y="256" text-anchor="middle">report.pdf →</text>
  <text class="s" x="380" y="271" text-anchor="middle">report-draft.pdf</text>

  <rect class="pick" x="505" y="196" width="220" height="84" rx="8"/>
  <text class="m" x="615" y="218" text-anchor="middle">Format</text>
  <text class="s" x="615" y="238" text-anchor="middle">custom format "trip", counter from 1</text>
  <text class="s" x="615" y="256" text-anchor="middle">IMG_4021.jpg →</text>
  <text class="s" x="615" y="271" text-anchor="middle">trip-001.jpg</text>

  <path class="link" d="M145,148 L145,190" marker-end="url(#bm)"/>
  <path class="link" d="M380,148 L380,190" marker-end="url(#bm)"/>
  <path class="link" d="M615,148 L615,190" marker-end="url(#bm)"/>
</svg>
