<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Sharing a local service through a reverse tunnel in TunnelMate, four steps: pick the service on your Mac; pick the port it gets on your server; flip the switch, which opens the tunnel and verifies the shared service answers; a health-checked Connected state, reported only after the check passes, with port problems explained in plain language — and the tunnel reconnects itself after sleep, Wi-Fi changes, and drops">
  <title>Sharing a local service from your Mac, four steps in TunnelMate</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .wide { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.5; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="110" y="18" width="540" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">Share a service from your Mac — reverse, without the terminal</text>

  <rect class="branch" x="22" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="107" y="116" text-anchor="middle">1 · Pick the service</text>
  <text class="s" x="107" y="133" text-anchor="middle">running on your Mac</text>

  <rect class="branch" x="204" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="289" y="116" text-anchor="middle">2 · Pick the port</text>
  <text class="s" x="289" y="133" text-anchor="middle">it gets on your server</text>

  <rect class="branch" x="386" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="471" y="116" text-anchor="middle">3 · Flip the switch</text>
  <text class="s" x="471" y="133" text-anchor="middle">no terminal, no flags</text>

  <rect class="branch" x="568" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="653" y="116" text-anchor="middle">4 · Connected</text>
  <text class="s" x="653" y="133" text-anchor="middle">only after a health check</text>

  <path class="link" d="M107,148 L107,190" marker-end="url(#bm)"/>
  <path class="link" d="M289,148 L289,190" marker-end="url(#bm)"/>
  <path class="link" d="M471,148 L471,190" marker-end="url(#bm)"/>
  <path class="link" d="M653,148 L653,190" marker-end="url(#bm)"/>

  <rect class="pick" x="22" y="196" width="170" height="84" rx="8"/>
  <text class="s" x="107" y="218" text-anchor="middle">the dev server, demo,</text>
  <text class="s" x="107" y="233" text-anchor="middle">or webhook target</text>
  <text class="s" x="107" y="248" text-anchor="middle">running on your Mac —</text>
  <text class="s" x="107" y="263" text-anchor="middle">nothing exposed directly</text>

  <rect class="pick" x="204" y="196" width="170" height="84" rx="8"/>
  <text class="s" x="289" y="218" text-anchor="middle">the address it gets on</text>
  <text class="s" x="289" y="233" text-anchor="middle">your server — teammates</text>
  <text class="s" x="289" y="248" text-anchor="middle">and webhooks reach</text>
  <text class="s" x="289" y="263" text-anchor="middle">your-server:8080</text>

  <rect class="pick" x="386" y="196" width="170" height="84" rx="8"/>
  <text class="s" x="471" y="218" text-anchor="middle">TunnelMate opens the</text>
  <text class="s" x="471" y="233" text-anchor="middle">tunnel and verifies the</text>
  <text class="s" x="471" y="248" text-anchor="middle">shared service actually</text>
  <text class="s" x="471" y="263" text-anchor="middle">answers through it</text>

  <rect class="pick" x="568" y="196" width="170" height="84" rx="8"/>
  <text class="s" x="653" y="218" text-anchor="middle">reported only when the</text>
  <text class="s" x="653" y="233" text-anchor="middle">check passes — server-side</text>
  <text class="s" x="653" y="248" text-anchor="middle">port problems come back</text>
  <text class="s" x="653" y="263" text-anchor="middle">in plain language</text>

  <rect class="wide" x="110" y="292" width="540" height="30" rx="8"/>
  <text class="s" x="380" y="311" text-anchor="middle">reconnects itself after sleep, Wi-Fi changes, and drops — still shared the next morning</text>
</svg>
