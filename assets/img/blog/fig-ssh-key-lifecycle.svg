<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The life of an SSH key created on a Mac: ssh-keygen -t ed25519 makes two files — the private key id_ed25519, which never leaves the Mac, and the public key id_ed25519.pub, which is installed on servers with ssh-copy-id or pasted into services like GitHub; when you connect, the agent offers the key and the Keychain supplies the passphrase">
  <title>How an SSH key travels from ssh-keygen to a working login</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .wide { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.5; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="270" y="18" width="220" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">ssh-keygen -t ed25519</text>

  <rect class="branch" x="130" y="96" width="220" height="52" rx="8"/>
  <text class="bt" x="240" y="116" text-anchor="middle">Private key</text>
  <text class="s" x="240" y="133" text-anchor="middle">~/.ssh/id_ed25519</text>

  <rect class="branch" x="410" y="96" width="220" height="52" rx="8"/>
  <text class="bt" x="520" y="116" text-anchor="middle">Public key</text>
  <text class="s" x="520" y="133" text-anchor="middle">~/.ssh/id_ed25519.pub</text>

  <path class="link" d="M330,62 C300,72 270,80 250,90" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C460,72 490,80 510,90" marker-end="url(#bm)"/>

  <rect class="pick" x="130" y="182" width="220" height="64" rx="8"/>
  <text class="bt" x="240" y="204" text-anchor="middle" fill="#0d6efd">Never leaves your Mac</text>
  <text class="s" x="240" y="224" text-anchor="middle">no email, no repos, no chats —</text>
  <text class="s" x="240" y="239" text-anchor="middle">chmod 600</text>

  <rect class="pick" x="410" y="182" width="220" height="64" rx="8"/>
  <text class="bt" x="520" y="204" text-anchor="middle" fill="#0d6efd">Goes on the server</text>
  <text class="s" x="520" y="224" text-anchor="middle">ssh-copy-id user@server, or pasted</text>
  <text class="s" x="520" y="239" text-anchor="middle">into GitHub &amp; co. settings</text>

  <path class="link" d="M240,148 L240,176" marker-end="url(#bm)"/>
  <path class="link" d="M520,148 L520,176" marker-end="url(#bm)"/>
  <path class="link" d="M240,246 C260,266 320,276 368,282" marker-end="url(#bm)"/>
  <path class="link" d="M520,246 C500,266 440,276 392,282" marker-end="url(#bm)"/>

  <rect class="wide" x="55" y="286" width="650" height="34" rx="8"/>
  <text class="s" x="380" y="307" text-anchor="middle">ssh user@server — the agent offers the key, the Keychain fills the passphrase: connected, nothing typed</text>
</svg>
