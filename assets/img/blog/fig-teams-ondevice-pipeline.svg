<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="On-device Teams meeting transcription pipeline in three steps: AudioRecord captures the call's microphone and system audio to a file on the Mac, the audio file is imported into MeetingMint, and MeetingMint generates structured AI meeting notes with summary, decisions, and action items — processing happens on-device and nothing is uploaded">
  <title>Transcribing a Teams meeting on-device, step by step</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .stage { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="180" y="18" width="400" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">From Teams call to meeting notes, on-device</text>

  <rect class="stage" x="40" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="140" y="120" text-anchor="middle" fill="#0d6efd">1 · Capture</text>
  <text class="s" x="140" y="143" text-anchor="middle">AudioRecord records the</text>
  <text class="s" x="140" y="159" text-anchor="middle">call's mic and system</text>
  <text class="s" x="140" y="175" text-anchor="middle">audio straight to a file</text>
  <text class="s" x="140" y="191" text-anchor="middle">on your Mac</text>

  <rect class="stage" x="280" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="380" y="120" text-anchor="middle" fill="#0d6efd">2 · Import</text>
  <text class="s" x="380" y="143" text-anchor="middle">drop the audio file into</text>
  <text class="s" x="380" y="159" text-anchor="middle">MeetingMint — any audio</text>
  <text class="s" x="380" y="175" text-anchor="middle">import; no conversion</text>
  <text class="s" x="380" y="191" text-anchor="middle">ritual</text>

  <rect class="stage" x="520" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="620" y="120" text-anchor="middle" fill="#0d6efd">3 · Notes</text>
  <text class="s" x="620" y="143" text-anchor="middle">AI meeting notes with</text>
  <text class="s" x="620" y="159" text-anchor="middle">summary, decisions, and</text>
  <text class="s" x="620" y="175" text-anchor="middle">action items — processed</text>
  <text class="s" x="620" y="191" text-anchor="middle">on-device</text>

  <path class="link" d="M240,155 L272,155" marker-end="url(#bm)"/>
  <path class="link" d="M480,155 L512,155" marker-end="url(#bm)"/>

  <rect class="pick" x="40" y="248" width="680" height="46" rx="8"/>
  <text class="s" x="380" y="268" text-anchor="middle">The raw meeting never leaves your machine: capture, transcription, and notes all</text>
  <text class="s" x="380" y="284" text-anchor="middle">happen locally — no uploads, nothing to delete from someone else's servers later.</text>
</svg>
