<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Decision flow for Teams meeting transcription: internal meetings on a plan with the feature enabled suit the built-in Teams transcript; confidential calls or missing plans suit on-device capture with AudioRecord and AI notes in MeetingMint; non-sensitive cross-platform meetings suit a joining bot; legal or compliance material suits human transcription services">
  <title>Which Teams transcription method fits which meeting</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .branch { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="272" y="18" width="216" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">What's the meeting?</text>

  <rect class="branch" x="22" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="107" y="116" text-anchor="middle">Internal, recurring,</text>
  <text class="s" x="107" y="133" text-anchor="middle">feature enabled by IT</text>

  <rect class="branch" x="204" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="289" y="116" text-anchor="middle">Confidential call,</text>
  <text class="s" x="289" y="133" text-anchor="middle">or no built-in feature</text>

  <rect class="branch" x="386" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="471" y="116" text-anchor="middle">Casual, cross-</text>
  <text class="s" x="471" y="133" text-anchor="middle">platform, not sensitive</text>

  <rect class="branch" x="568" y="96" width="170" height="52" rx="8"/>
  <text class="bt" x="653" y="116" text-anchor="middle">Legal, compliance,</text>
  <text class="s" x="653" y="133" text-anchor="middle">evidentiary record</text>

  <path class="link" d="M330,62 C280,72 190,80 115,90" marker-end="url(#bm)"/>
  <path class="link" d="M360,62 C340,72 310,80 292,90" marker-end="url(#bm)"/>
  <path class="link" d="M400,62 C420,72 450,80 468,90" marker-end="url(#bm)"/>
  <path class="link" d="M430,62 C480,72 570,80 645,90" marker-end="url(#bm)"/>

  <rect class="pick" x="22" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="107" y="218" text-anchor="middle" fill="#0d6efd">Built-in Teams</text>
  <text class="bt" x="107" y="234" text-anchor="middle" fill="#0d6efd">transcript</text>
  <text class="s" x="107" y="252" text-anchor="middle">zero effort; lives in</text>
  <text class="s" x="107" y="267" text-anchor="middle">the org's cloud</text>

  <rect class="pick" x="204" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="289" y="218" text-anchor="middle" fill="#0d6efd">On-device capture</text>
  <text class="bt" x="289" y="234" text-anchor="middle" fill="#0d6efd">+ AI notes</text>
  <text class="s" x="289" y="252" text-anchor="middle">AudioRecord records,</text>
  <text class="s" x="289" y="267" text-anchor="middle">MeetingMint writes</text>

  <rect class="pick" x="386" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="471" y="218" text-anchor="middle" fill="#0d6efd">Joining bot</text>
  <text class="s" x="471" y="238" text-anchor="middle">hands-off; extra</text>
  <text class="s" x="471" y="253" text-anchor="middle">participant, vendor</text>
  <text class="s" x="471" y="268" text-anchor="middle">cloud processing</text>

  <rect class="pick" x="568" y="196" width="170" height="84" rx="8"/>
  <text class="bt" x="653" y="218" text-anchor="middle" fill="#0d6efd">Human service</text>
  <text class="s" x="653" y="238" text-anchor="middle">accuracy standard;</text>
  <text class="s" x="653" y="253" text-anchor="middle">per-minute cost and</text>
  <text class="s" x="653" y="268" text-anchor="middle">turnaround</text>

  <path class="link" d="M107,148 L107,190" marker-end="url(#bm)"/>
  <path class="link" d="M289,148 L289,190" marker-end="url(#bm)"/>
  <path class="link" d="M471,148 L471,190" marker-end="url(#bm)"/>
  <path class="link" d="M653,148 L653,190" marker-end="url(#bm)"/>
</svg>
