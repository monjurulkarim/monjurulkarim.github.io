<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="On-device desktop cleanup pipeline in three steps: TidyMind scans the desktop and reads what each file is, documents and images included, on your machine; the proposed folder plan is reviewed and corrected by you with nothing moving until approval; files are then applied to their folders with per-session undo — the models download once and everything runs offline">
  <title>How the TidyMind desktop cleanup works, step by step</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .stage { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="205" y="18" width="350" height="44" rx="22"/>
  <text class="t" x="380" y="46" text-anchor="middle" fill="#ffffff">From a messy desktop to filed folders</text>

  <rect class="stage" x="40" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="140" y="120" text-anchor="middle" fill="#0d6efd">1 · Scan + read</text>
  <text class="s" x="140" y="143" text-anchor="middle">point TidyMind at the desktop;</text>
  <text class="s" x="140" y="159" text-anchor="middle">it reads what each file is —</text>
  <text class="s" x="140" y="175" text-anchor="middle">documents and images (OCR)</text>
  <text class="s" x="140" y="191" text-anchor="middle">— on your machine</text>

  <rect class="stage" x="280" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="380" y="120" text-anchor="middle" fill="#0d6efd">2 · Review the plan</text>
  <text class="s" x="380" y="143" text-anchor="middle">folders proposed with every</text>
  <text class="s" x="380" y="159" text-anchor="middle">file in one; drag files to fix</text>
  <text class="s" x="380" y="175" text-anchor="middle">the plan — nothing moves</text>
  <text class="s" x="380" y="191" text-anchor="middle">until you approve</text>

  <rect class="stage" x="520" y="96" width="200" height="118" rx="8"/>
  <text class="bt" x="620" y="120" text-anchor="middle" fill="#0d6efd">3 · Apply + undo</text>
  <text class="s" x="620" y="143" text-anchor="middle">files land in their folders;</text>
  <text class="s" x="620" y="159" text-anchor="middle">undo any session returns</text>
  <text class="s" x="620" y="175" text-anchor="middle">everything exactly</text>
  <text class="s" x="620" y="191" text-anchor="middle">where it was</text>

  <path class="link" d="M240,155 L272,155" marker-end="url(#bm)"/>
  <path class="link" d="M480,155 L512,155" marker-end="url(#bm)"/>

  <rect class="pick" x="40" y="248" width="680" height="46" rx="8"/>
  <text class="s" x="380" y="268" text-anchor="middle">On-device by design: the AI models download once on first use, then everything runs offline —</text>
  <text class="s" x="380" y="284" text-anchor="middle">no uploads, no accounts, no cloud, and undo for every session.</text>
</svg>
