<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Where transcription audio goes: on-device tools process the mic or file input on your Mac with Whisper and a local language model and return transcript and minutes with nothing uploaded; cloud tools upload the meeting or recording to a vendor whose servers produce the transcript that comes back — the deciding question is where the audio is processed, not accuracy">
  <title>On-device versus cloud transcription: where the audio goes</title>
  <defs>
    <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #212529; }
    .q { fill: #0d6efd; }
    .box { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .wire { fill: #eef4ff; stroke: #0d6efd; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .t { font-size: 14px; font-weight: 700; }
    .bt { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #6c757d; }
    .link { stroke: #0d6efd; stroke-width: 1.75; fill: none; }
  </style>

  <rect class="q" x="20" y="54" width="140" height="56" rx="10"/>
  <text class="t" x="90" y="78" text-anchor="middle" fill="#ffffff">On device</text>
  <text class="s" x="90" y="96" text-anchor="middle" style="fill:#ffffff">Whisper, MeetingMint</text>

  <rect class="box" x="190" y="48" width="180" height="68" rx="8"/>
  <text class="bt" x="280" y="74" text-anchor="middle">Mic or audio file</text>
  <text class="s" x="280" y="92" text-anchor="middle">live capture or import</text>

  <rect class="wire" x="405" y="48" width="170" height="68" rx="8"/>
  <text class="bt" x="490" y="74" text-anchor="middle" fill="#0d6efd">Processed on your Mac</text>
  <text class="s" x="490" y="92" text-anchor="middle">Whisper + local LLM</text>

  <rect class="box" x="610" y="48" width="130" height="68" rx="8"/>
  <text class="bt" x="675" y="66" text-anchor="middle">Transcript</text>
  <text class="s" x="675" y="84" text-anchor="middle">+ minutes,</text>
  <text class="s" x="675" y="102" text-anchor="middle">nothing uploaded</text>

  <path class="link" d="M375,82 L399,82" marker-end="url(#bm)"/>
  <path class="link" d="M580,82 L604,82" marker-end="url(#bm)"/>
  <text class="s" x="395" y="136" text-anchor="middle">the audio never leaves the machine it started on</text>

  <rect class="q" x="20" y="194" width="140" height="56" rx="10"/>
  <text class="t" x="90" y="218" text-anchor="middle" fill="#ffffff">In the cloud</text>
  <text class="s" x="90" y="236" text-anchor="middle" style="fill:#ffffff">Otter and similar</text>

  <rect class="box" x="190" y="188" width="180" height="68" rx="8"/>
  <text class="bt" x="280" y="214" text-anchor="middle">Meeting or recording</text>
  <text class="s" x="280" y="232" text-anchor="middle">live call or a file</text>

  <rect class="wire" x="405" y="188" width="170" height="68" rx="8"/>
  <text class="bt" x="490" y="214" text-anchor="middle" fill="#0d6efd">Uploaded to a vendor</text>
  <text class="s" x="490" y="232" text-anchor="middle">servers process it</text>

  <rect class="box" x="610" y="188" width="130" height="68" rx="8"/>
  <text class="bt" x="675" y="206" text-anchor="middle">Transcript</text>
  <text class="s" x="675" y="224" text-anchor="middle">comes back —</text>
  <text class="s" x="675" y="242" text-anchor="middle">audio went with it</text>

  <path class="link" d="M375,222 L399,222" marker-end="url(#bm)"/>
  <path class="link" d="M580,222 L604,222" marker-end="url(#bm)"/>
  <text class="s" x="395" y="276" text-anchor="middle">convenient — and the recording sits with a third party</text>

  <text class="s" x="380" y="312" text-anchor="middle">Accuracy is no longer the differentiator — the deciding question is where the audio goes while it is processed.</text>
</svg>
